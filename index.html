<!DOCTYPE html>
<html lang="en">
<head>
<meta charset= "UTF-8"/>
<meta name ="viewport" content="width=device-width, initial-scale=1.0"/>
<title> HTML Registration Form </title>
<style>
body{
font-family:Arial,san-serif;
margin:0;
padding:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
main{
background-color:#fff;
border radius:15px;
box-shadow:0 0 20px rgba(0,0,0,0.2);
padding:20px;
width:300px;
}
.main h2{
color:#4caf50;
margin-bottom:20px;
}
label{
display:block;
margin-bottom:5px;
color:#555;
font-weight:bold;
}
input[type="text"],
input[type="email"],
input[type="password"],
select{
width:100%;
margin-bottom:15px;
padding:10px;
box-sizing :border-box;
border-radius:5px;
}
button[type="submit"]{
padding:15px;
border-radius:10px;
background-color:#4caf50;
color:white;
cursor:pointer;
font-size:16px;
}
</style>
<body>
<div class="main">
<h2>Registration Form</h2>
<form action ="">
<label for="first" >First Name:</label>
<input type="text" id="first" name="first" required/>
<label for="last" >Last Name:</label>	
<input type="text" id="last" name="last" required/>
<label for="email" >Email:</label>
<input type="email" id="email" name="email" required/>
<label for="password" >Password:</label>
<input type="password" id="password" name="password" pattern="^(?=.*/d)(?=.*[a-z A-Z])(?=.*[^a-z A-Z 0-9]/s{8,}$"title="password must contain atleast one number,one alphabet, one symbol, and be atleast 8 characters long" required/>
<label for="repassword">Retype password:</label>
<input type="password" id="repassword" name="repassword" required/>
<label for="mobile"> contact: </label>
<input type="text" id="mobile" name="mobile" maxlength="10" required/>
<label for="gender"> Gender:</label>
<select id="gender" name="gender" required>
<option value= "male">Male</option>
<option value= "female">Female</option>
</select>
<button type="submit">submit</button>
</form>
</div>
</body>
</html>
